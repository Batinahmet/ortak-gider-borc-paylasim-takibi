# fly.toml app configuration file generated for backend-evergreen-mountain-4322 on 2026-11-12T22:59:01+03:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'backend-evergreen-mountain-4322'
primary_region = 'fra'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = "ortak_gider_data"
  destination = "/data"
